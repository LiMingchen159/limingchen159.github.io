name: Update Publications from Google Scholar

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: new-homepage

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run update script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          python scripts/update_publications.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: auto-update publications from Google Scholar'
          title: '🤖 Auto-update: Publications from Google Scholar'
          body: |
            ## 📚 Automated Publication Update
            
            This pull request contains updates to publications and news from Google Scholar.
            
            ### Changes
            - Updated `src/data/publications.json` with latest citation counts
            - Updated `src/data/news.json` with any new publications or yearly summaries
            
            ### Review Checklist
            - [ ] Check new publications are correctly formatted
            - [ ] Verify citation counts are updated
            - [ ] **Review author status** (first/corresponding/other) for new publications
            - [ ] **Add month information** for new publications (currently empty by default)
            - [ ] Review any new yearly summaries
            - [ ] Verify venue names and publication year
            
            **Note**: This PR was automatically created by the scheduled workflow. Please review and merge if everything looks correct.
          branch: 'auto-update/publications'
          delete-branch: true
          labels: |
            automated
            publications

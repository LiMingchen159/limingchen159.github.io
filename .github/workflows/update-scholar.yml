name: Update Publications from Google Scholar

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-publications:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: new-homepage

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run update script
        id: update-script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          python scripts/update_publications.py
          
          # Parse the summary JSON to set outputs
          echo "Parsing update summary..."
          if [ -f publications_update_summary.json ]; then
            has_new_papers=$(jq -r '.has_new_papers' publications_update_summary.json)
            has_citation_updates=$(jq -r '.has_citation_updates' publications_update_summary.json)
            
            echo "has_new_papers=$has_new_papers" >> $GITHUB_OUTPUT
            echo "has_citation_updates=$has_citation_updates" >> $GITHUB_OUTPUT
            
            # If new papers, create a list for the PR body
            if [ "$has_new_papers" = "true" ]; then
              echo "new_paper_titles<<EOF" >> $GITHUB_OUTPUT
              jq -r '.new_paper_titles[]' publications_update_summary.json >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          else
            echo "No summary file found. Assuming no changes."
            echo "has_new_papers=false" >> $GITHUB_OUTPUT
            echo "has_citation_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request (New Papers)
        if: steps.update-script.outputs.has_new_papers == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: auto-update publications (new papers found)'
          title: '🤖 Auto-update: New Papers Detected'
          body: |
            ## 📚 New Publications Detected
            
            The following new papers were found and added with empty dates:
            
            ${{ steps.update-script.outputs.new_paper_titles }}
            
            ### Action Required
            - [ ] **Manually add the `date` (YYYY-MM-DD)** for each new paper in `src/data/publications.json`.
            - [ ] Verify author status and other details.
            
            This PR was automatically created because new papers were detected.
          branch: 'auto-update/new-publications'
          delete-branch: true
          labels: |
            automated
            publications
            needs-manual-review

      - name: Commit and Push (Citations Only)
        if: steps.update-script.outputs.has_new_papers == 'false' && steps.update-script.outputs.has_citation_updates == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/publications.json src/data/news.json
          git commit -m "chore: auto-update citations"
          git push origin HEAD:${{ github.ref }}


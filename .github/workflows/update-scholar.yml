name: Update Publications from Google Scholar

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-publications:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: new-homepage

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Update Script
        id: update-script
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/update_publications_v2.py
          
          # Set outputs from summary JSON
          if [ -f publications_update_summary.json ]; then
            echo "has_new_papers=$(python -c "import json; print(str(json.load(open('publications_update_summary.json'))['has_new_papers']).lower())")" >> $GITHUB_OUTPUT
            echo "has_citation_updates=$(python -c "import json; print(str(json.load(open('publications_update_summary.json'))['has_citation_updates']).lower())")" >> $GITHUB_OUTPUT
            
            # For titles, we can just read them into a variable
            echo "new_paper_titles<<EOF" >> $GITHUB_OUTPUT
            python -c "import json; print('\n'.join(json.load(open('publications_update_summary.json'))['new_paper_titles']))" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request for New Papers
        if: steps.update-script.outputs.has_new_papers == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: add new publications detected from Google Scholar"
          title: "🤖 New Publications Detected"
          body: |
            ## 📚 New Publications Detected
            
            The following new papers were found and added with empty dates:
            
            ${{ steps.update-script.outputs.new_paper_titles }}
            
            ### Action Required
            - [ ] **Manually add the `date` (YYYY-MM-DD)** for each new paper in `src/data/publications.json`.
            - [ ] Verify author status and other details.
            
            This PR was automatically created because new papers were detected.
          branch: 'auto-update/new-publications'
          delete-branch: true
          labels: |
            automated
            publications
            needs-manual-review

      - name: Commit and Push (Citations Only)
        if: steps.update-script.outputs.has_new_papers == 'false' && steps.update-script.outputs.has_citation_updates == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/publications.json src/data/news.json
          git commit -m "chore: auto-update citations"
          git push origin HEAD:${{ github.ref }}

      - name: Trigger Deployment
        if: steps.update-script.outputs.has_new_papers == 'false' && steps.update-script.outputs.has_citation_updates == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref ${{ github.ref }}
